<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Animation Playground</title>
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #0f0f1b;
        font-family: "Arial", sans-serif;
        color: #b388ff;
        margin: 0;
        padding: 50px 0;
      }

      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 60px;
      }

      h1 {
        font-size: 20px;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-bottom: 30px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .box-grid {
        display: flex;
        gap: 20px;
      }

      .base-box {
        width: 120px;
        height: 120px;
        background-color: #7c4dff;
        border-radius: 15px;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        font-size: 0.9rem;
        cursor: pointer;
        transition: all 0.4s ease;
      }

      .translate:hover {
        transform: translateY(-15px);
      }
      .rotate:hover {
        transform: rotate(45deg);
      }
      .scale:hover {
        transform: scale(1.3);
      }
      .combine:hover {
        transform: scale(1.2) rotate(-10deg) translateY(-10px);
      }

      .card-grid {
        display: flex;
        gap: 20px;
      }

      .card {
        position: relative;
        width: 200px;
        height: 280px;
        border-radius: 20px;
      }

      .card img {
        width: 100%;
        height: 100%;

        object-fit: cover;
      }

      .overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(124, 77, 255, 0.6);
        display: flex;
        justify-content: center;
        align-items: center;
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .card:hover .overlay {
        opacity: 1;
      }

      .loaders {
        display: flex;
        gap: 30px;
      }
      .loader1 {
        width: 40px;
        height: 40px;
        border: 5px solid #7c4dff;
        border-top: 5px solid transparent;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      .dot1,
      .dot2,
      .dot3 {
        width: 10px;
        height: 10px;
        background-color: #7c4dff;
        border-radius: 50%;
      }
      .dot1 {
        animation: bounce 1.5s ease-in-out infinite;
        animation-delay: 0s;
      }
      .dot2 {
        animation: bounce 1.5s ease-in-out infinite;
        animation-delay: 0.15s;
      }
      .dot3 {
        animation: bounce 1.5s ease-in-out infinite;
        animation-delay: 0.3s;
      }
      .loader2 {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        animation: bounce 1.5s ease-in-out infinite;
      }
      .loader3 {
        display: flex;
        gap: 3px;
      }
      .jamb1,
      .jamb2,
      .jamb3,
      .jamb4,
      .jamb5 {
        width: 10px;
        height: 20px;
        background-color: #7c4dff;
        border-radius: 4px;
      }

      .jamb1,
      .jamb3,
      .jamb5 {
        background-color: #bda5ff;
      }
      .jamb1 {
        animation: pulse_y 1s ease-in-out infinite;
        animation-delay: 0s;
      }

      .jamb2 {
        animation: pulse_y 1s ease-in-out infinite;
        animation-delay: 0.1s;
      }
      .jamb3 {
        animation: pulse_y 1s ease-in-out infinite;
        animation-delay: 0.2s;
      }
      .jamb4 {
        animation: pulse_y 1s ease-in-out infinite;
        animation-delay: 0.3s;
      }
      .jamb5 {
        animation: pulse_y 1s ease-in-out infinite;
        animation-delay: 0.4s;
      }

      @keyframes pulse_y {
        0%,
        100% {
          transform: scaleY(1);
        }
        50% {
          transform: scaleY(3);
        }
      }
      @keyframes bounce {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-20px);
        }
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.2);
        }
      }
      @keyframes slidein {
        0% {
          transform: translateX(100%);
          opacity: 0;
        }
        100% {
          transform: translateX(0);
          opacity: 1;
        }
      }

      .bounce-box {
        animation: bounce 2s infinite;
        background-color: #ff5252;
      }
      .spin-box {
        animation: spin 3s linear infinite;
        background-color: #ff4081;
      }
      .pulse-box {
        animation: pulse 1.5s ease-in-out infinite;
        background-color: #e040fb;
      }
      .slidein-box {
        animation: slidein 1s ease-out forwards;
        background-color: #d500f9;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box-container1">
        <h1>TRANSFORM - HOVER VÀO TỪNG Ô</h1>
        <div class="box-grid">
          <div class="base-box translate">translate</div>
          <div class="base-box rotate">rotate</div>
          <div class="base-box scale">scale</div>
          <div class="base-box combine">combine</div>
        </div>
      </div>

      <div class="box-container2">
        <h1>OVERLAY EFFECT - HOVER VÀO CARD</h1>
        <div class="card-grid">
          <div class="card">
            <img
              src="https://encrypted-tbn0.gstatic.com/shopping?q=tbn:ANd9GcQ9h5g143iUp3TVpEkKpT9Lcv6tYAW37rGX0eIM6MeIcKotRyPBDQBP5T6jCC3m34m9Cz265ah2VIebGKWPc9TM60N0FSQBuesIeBND1hWQrvjmaU7PWoSN&usqp=CAc"
            />
            <div class="overlay">
              <i style="font-size: 3rem; color: white"></i>
            </div>
          </div>
          <div class="card">
            <img
              src="https://i.ebayimg.com/images/g/f84AAeSwf5Np6CZG/s-l1600.webp"
            />
            <div class="overlay">
              <i style="font-size: 3rem; color: white"></i>
            </div>
          </div>
        </div>
      </div>

      <div>
        <h1>@KEYFRAMES ANIMATION</h1>
        <div class="box-grid">
          <div class="base-box bounce-box">bounce</div>
          <div class="base-box spin-box">spin</div>

          <div class="base-box pulse-box">pulse</div>

          <div class="base-box slidein-box">slide in</div>
        </div>
      </div>
      <div>
        <h1>CSS Loaders (PURE CSS)</h1>
        <div class="loaders">
          <div class="loader1"></div>
          <div class="loader2">
            <div class="dot1"></div>
            <div class="dot2"></div>
            <div class="dot3"></div>
          </div>
          <div class="loader3">
            <div class="jamb1"></div>
            <div class="jamb2"></div>
            <div class="jamb3"></div>
            <div class="jamb4"></div>
            <div class="jamb5"></div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
